stages:
  - wes

variables:
  OUTPUT_DIR: "$CI_PROJECT_DIR/output/wes"
  WES_RESULTS_SUBDIR: "results"
  WES_LOGS_SUBDIR: "logs"
  WES_MODE: "preprocess-batch"
  WES_FASTQ_DIR: "/home/zhangmeigroup/luoxin23/upload20251105/fastq"
  WES_TEST_R1: "/home/zhangmeigroup/luoxin23/upload20251105/fastq/2103022S1OWC_S12_R1_001.fastq.gz"
  WES_TEST_R2: "/home/zhangmeigroup/luoxin23/upload20251105/fastq/2103022S1OWC_S12_R2_001.fastq.gz"
  WES_INSTALL_SMOKE: "1"
  WES_RESOURCE_BASE: "/home/zhangmeigroup/luoxin23/resources/hg38"
  WES_ALLOW_MISSING_KNOWN_SITES: "1"
  WES_CONDA_CHANNELS: "conda-forge bioconda"
  WES_CONDA_PACKAGES: "bwa bcftools gatk4 fastqc"
  WES_RESOURCE_CONDA_PACKAGES: "bwa samtools gatk4 htslib"
  WES_PIPELINE_USE_CONDA: "1"
  WES_PIPELINE_CONDA_PACKAGES: "bwa samtools bcftools gatk4 htslib fastp fastqc"
  WES_PREPROCESS_CONDA_PACKAGES: "bwa samtools bcftools gatk4 htslib fastp fastqc"
  WES_SKIP_VEP: "1"
  REF_URL: "https://ftp.ncbi.nlm.nih.gov/genomes/all/GCA/000/001/405/GCA_000001405.15_GRCh38/seqs_for_alignment_pipelines.ucsc_ids/GCA_000001405.15_GRCh38_no_alt_analysis_set.fna.gz"
  DBSNP_URL: "https://storage.googleapis.com/genomics-public-data/resources/broad/hg38/v0/Homo_sapiens_assembly38.dbsnp138.vcf"
  KNOWN_INDELS_URL: "https://storage.googleapis.com/genomics-public-data/resources/broad/hg38/v0/Homo_sapiens_assembly38.known_indels.vcf.gz"
  MILLS_URL: "https://storage.googleapis.com/genomics-public-data/resources/broad/hg38/v0/Mills_and_1000G_gold_standard.indels.hg38.vcf.gz"
  GENCODE_GTF_URL: "https://ftp.ebi.ac.uk/pub/databases/gencode/Gencode_human/release_48/gencode.v48.basic.annotation.gtf.gz"
  WES_BED_PADDING_BP: "50"
  WES_SAMPLE_SHEET: "$CI_PROJECT_DIR/config/wes/samples.from-excel.tsv"
  WES_REF_PATH: "/home/zhangmeigroup/luoxin23/resources/hg38/reference/Homo_sapiens_assembly38.fasta"
  WES_BED_PATH: "/home/zhangmeigroup/luoxin23/resources/hg38/targets/exome_targets.bed"
  WES_GENERATE_SAMPLE_SHEET_FROM_FASTQ: "0"
  WES_PERSISTENT_RESULTS_ROOT: "/home/zhangmeigroup/luoxin23/wes-stage-results"
  WES_STAGE_OUT_DIR: "/home/zhangmeigroup/luoxin23/wes-stage-results/preprocess-batch"
  SLURM_ENV_SETUP: "source ~/.bashrc"
  WES_SKIP_FASTQC: "1"
  WES_SKIP_BQSR_PREPROCESS: "1"
  WES_BATCH_MAX_CONCURRENT: "12"
  WES_PIPELINE_STAGE: "preprocess"
  WES_PIPELINE_EXTRA_ARGS: "--skip-bqsr --skip-fastqc"
  WES_PIPELINE_CMD: "bash pipelines/wes-germline.sh --sample-sheet \"$WES_SAMPLE_SHEET\" --out \"$WES_STAGE_OUT_DIR\" --ref \"$WES_REF_PATH\" --bed \"$WES_BED_PATH\" --stage \"$WES_PIPELINE_STAGE\" --threads \"$SLURM_CPUS_PER_TASK\" ${WES_PIPELINE_EXTRA_ARGS}"

  SLURM_JOB_NAME: "wes-preprocess"
  SLURM_PARTITION: "CPU-64C256GB"
  SLURM_QOS: "qos_cpu_64c256gb"
  SLURM_NODES: "1"
  SLURM_NTASKS: "1"
  SLURM_CPUS_PER_TASK: "6"
  SLURM_MEM: "24G"
  SLURM_TIME: "48:00:00"

wes_submit:
  stage: wes
  timeout: 48 hours
  tags:
    - wes
  script:
    - bash scripts/ci-submit-slurm.sh
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - output/wes/*.txt
      - output/wes/logs/*.log
      - output/wes/slurm/*.out
      - output/wes/slurm/*.err
      - output/wes/results/qc-report/*
