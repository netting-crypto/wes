stages:
  - run

variables:
  HEADLESS: "1"
  OUTPUT_DIR: "$CI_PROJECT_DIR/output/reports"
  STORAGE_STATE_PATH: "$CI_PROJECT_DIR/data/storage-state.json"
  TEMPLATE_DIR: "$CI_PROJECT_DIR/templates"
  SLURM_JOB_NAME: "wes-pipeline"
  SLURM_TIME: "00:30:00"
  SLURM_CPUS_PER_TASK: "2"
  SLURM_MEM: "4G"

run_task:
  stage: run
  tags:
    - wes
  script:
    - bash scripts/ci-submit-slurm.sh
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - output/reports/
      - output/slurm/